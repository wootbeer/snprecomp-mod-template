# Builds the .nrm on every push. Download it from the run's Artifacts.
# Push a tag like v1.0.0 and it also makes a release with the .nrm.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 zip

      - name: Get RecompModTool
        run: |
          curl -sSLf -o RecompModTool https://github.com/N64Recomp/N64Recomp/releases/download/mod-tool-release/RecompModTool
          chmod +x RecompModTool

      - name: Build
        run: make nrm CC=clang-18 LD=ld.lld-18

      - uses: actions/upload-artifact@v4
        with:
          name: mod
          path: build/*.nrm

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.nrm --title "$GITHUB_REF_NAME" --notes-file release_notes.md
